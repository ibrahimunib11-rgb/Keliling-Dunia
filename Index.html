        // Sound Synthesis (Offline friendly)
        const playSound = (type) => {
            if (!window.soundEnabled) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            } else if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            }
        };

        const App = () => {
            const [view, setView] = useState('home'); // home, materi, setup, game, waiting, leaderboard
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [gameMode, setGameMode] = useState(null); // SOLO, DUEL, SQUAD
            const [players, setPlayers] = useState([]);
            const [currentPlayerIndex, setCurrentPlayerIndex] = useState(0);
            const [materiExplored, setMateriExplored] = useState(new Set());

            const [formPlayers, setFormPlayers] = useState(Array(4).fill({name: '', avatarId: AVATARS[0].id}));

            // Sync global audio flag
            useEffect(() => { window.soundEnabled = soundEnabled; }, [soundEnabled]);

            // Utility to shuffle array
            const shuffle = (array) => {
                let currentIndex = array.length, randomIndex;
                while (currentIndex !== 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
                return array;
            };

            const startGame = (setupPlayers) => {
                const initializedPlayers = setupPlayers.map(p => {
                    const shuffledQuestions = shuffle([...BANK_SOAL]).slice(0, 15);
                    
                    const processedQuestions = shuffledQuestions.map(q => {
                        const ops = [...q.options];
                        const correctAnswerString = ops[q.answer];
                        const shuffledOps = shuffle([...ops]);
                        const newAnswerIndex = shuffledOps.indexOf(correctAnswerString);
                        
                        return { ...q, options: shuffledOps, answer: newAnswerIndex };
                    });

                    return {
                        ...p,
                        score: 0,
                        correctCount: 0,
                        wrongCount: 0,
                        currentQIndex: 0,
                        questions: processedQuestions,
                        isFinished: false,
                        feedback: null
                    };
                });

                setPlayers(initializedPlayers);
                setCurrentPlayerIndex(0);
                setView('game');
                playSound('click');
            };

            const triggerConfetti = () => {

                                                            {!player.feedback.isCorrect && (
                                                                <div className="text-[10px] md:text-xs font-bold mb-2 text-slate-700">
                                                                    Jawaban Benar: <span className="text-green-700 bg-green-100 px-1.5 py-0.5 rounded ml-1">{currentQ.options[currentQ.answer]}</span>
                                                                </div>
                                                            )}
                                                            <p className="text-slate-600 text-[10px] md:text-xs leading-relaxed bg-slate-50 p-2 md:p-3 rounded-lg border border-slate-100">
                                                                {currentQ.exp}
                                                            </p>
                                                        </div>
                                                        
                                                        <button 
                                                            onClick={() => handleNext(pIndex)}
                                                            className="shrink-0 w-full bg-indigo-500 hover:bg-indigo-400 text-white font-black py-2.5 md:py-3 rounded-xl shadow-[0_4px_0_#3730a3] active:translate-y-1 active:shadow-none transition-all text-xs md:text-sm flex justify-center items-center gap-2">
                                                            <span>LANJUT MISI</span> ➡️
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    );
                }

                if (view === 'waiting') {
                    const allFinished = players.every(p => p.isFinished);
                    const nextPlayerIndex = players.findIndex(p => !p.isFinished);

                    return (
                        <div className="flex flex-col items-center justify-center h-full bg-slate-800 text-white p-4">
                            <div className="glass-panel p-8 rounded-3xl w-full max-w-lg text-center text-slate-800">
                                
                                {players[currentPlayerIndex].isFinished && !allFinished && (
                                    <div className="mb-6">
                                        <div className="text-4xl mb-2">🎉</div>
                                        <h2 className="text-2xl font-black text-green-600">Hebat! {players[currentPlayerIndex].name} telah menyelesaikan semua soal!</h2>
                                    </div>
                                )}

                                <h2 className="text-2xl font-bold mb-6 text-slate-600">
                                    {allFinished ? '🏁 SEMUA PEMAIN SELESAI!' : '⏳ STATUS PEMAIN'}
                                </h2>

                                <div className="space-y-3 mb-8">
                                    {players.map((p, idx) => (
                                        <div key={idx} className={`flex items-center justify-between p-4 rounded-xl border-2 ${p.isFinished ? 'bg-green-50 border-green-200' : 'bg-slate-50 border-slate-200'}`}>
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">{p.avatar.icon}</span>
                                                <span className="font-bold text-lg">{p.name}</span>
                                            </div>
                                            <div className="font-bold flex items-center gap-2">
                                                {p.isFinished ? (
                                                    <><span className="text-green-500">🟢 Selesai</span></>
                                                ) : (
                                                    <><span className="text-amber-500 animate-pulse">🟡 Menunggu giliran</span></>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {allFinished ? (
                                    <button 
                                        onClick={() => { playSound('click'); triggerConfetti(); setView('leaderboard'); }}
                                        className="w-full bg-amber-400 hover:bg-amber-300 text-slate-800 font-black py-4 rounded-2xl shadow-[0_6px_0_#b45309] active:translate-y-1 active:shadow-none transition-all text-xl">
                                        🏆 LIHAT LEADERBOARD
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => { playSound('click'); setCurrentPlayerIndex(nextPlayerIndex); setView('game'); }}
                                        className="w-full bg-indigo-500 hover:bg-indigo-400 text-white font-black py-4 rounded-2xl shadow-[0_6px_0_#3730a3] active:translate-y-1 active:shadow-none transition-all text-xl">
                                        MULAI GILIRAN {players[nextPlayerIndex].name} ➡️
                                    </button>
                                )}
                            </div>
                        </div>
                    );
                }

                if (view === 'leaderboard') {
                    const sortedPlayers = [...players].sort((a, b) => {
                        if (b.score !== a.score) return b.score - a.score;
                        return b.correctCount - a.correctCount;
                    });

                    return (
                        <div className="flex flex-col h-full bg-gradient-to-b from-indigo-900 to-purple-900 text-white p-4 overflow-y-auto">
                            <div className="max-w-4xl w-full mx-auto py-8">
                                
                                <div className="text-center mb-10">
                                    <h1 className="text-4xl md:text-5xl font-black text-amber-400 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] mb-2">🏆 LEADERBOARD</h1>
                                    <p className="text-xl text-indigo-200">Dunia Telah Selesai Dieksplorasi!</p>
                                </div>

                                <div className="flex justify-center items-end h-48 mb-12 gap-2 md:gap-4 px-2">
                                    {/* 2nd Place */}
                                    {sortedPlayers.length > 1 && (
                                        <div className="flex flex-col items-center w-1/3 max-w-[120px]">
                                            <div className="text-3xl mb-1">{sortedPlayers[1].avatar.icon}</div>
                                            <div className="font-bold truncate w-full text-center">{sortedPlayers[1].name}</div>
                                            <div className="bg-slate-300 w-full h-24 rounded-t-lg flex flex-col items-center justify-end pb-2 text-slate-800 font-black relative overflow-hidden">
                                                <div className="absolute inset-0 bg-gradient-to-b from-white/40 to-transparent"></div>
                                                🥈<br/>{sortedPlayers[1].score}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* 1st Place */}
                                    <div className="flex flex-col items-center w-1/3 max-w-[140px] z-10">
                                        <div className="text-5xl mb-2 float-anim">{sortedPlayers[0].avatar.icon}</div>
                                        <div className="font-bold text-amber-300 truncate w-full text-center text-lg">{sortedPlayers[0].name}</div>
                                        <div className="bg-amber-400 w-full h-32 rounded-t-lg flex flex-col items-center justify-end pb-2 text-amber-900 font-black text-xl relative overflow-hidden shadow-[0_0_20px_rgba(251,191,36,0.5)]">
                                            <div className="absolute inset-0 bg-gradient-to-b from-white/50 to-transparent"></div>
                                            🥇<br/>{sortedPlayers[0].score}
                                        </div>
                                    </div>

                                    {/* 3rd Place */}
                                    {sortedPlayers.length > 2 && (
                                        <div className="flex flex-col items-center w-1/3 max-w-[120px]">
                                            <div className="text-3xl mb-1">{sortedPlayers[2].avatar.icon}</div>
                                            <div className="font-bold truncate w-full text-center">{sortedPlayers[2].name}</div>
                                            <div className="bg-amber-700 w-full h-16 rounded-t-lg flex flex-col items-center justify-end pb-2 text-amber-100 font-black relative overflow-hidden">
                                                <div className="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent"></div>
                                                🥉<br/>{sortedPlayers[2].score}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Full List Table */}
                                <div className="bg-white/10 backdrop-blur-md rounded-3xl p-4 md:p-6 mb-8 border border-white/20">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="text-indigo-200 border-b border-indigo-400/30">
                                                <th className="p-3">Rank</th>
                                                <th className="p-3">Penjelajah</th>
                                                <th className="p-3 text-center">Benar</th>
                                                <th className="p-3 text-center">Salah</th>
                                                <th className="p-3 text-right">Skor</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sortedPlayers.map((p, idx) => (
                                                <tr key={idx} className="border-b border-indigo-400/10 hover:bg-white/5 transition">
                                                    <td className="p-3 font-bold text-xl">
                                                        {idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx+1}`}
                                                    </td>
                                                    <td className="p-3 flex items-center gap-3">
                                                        <span className="text-2xl bg-white/10 p-2 rounded-lg">{p.avatar.icon}</span>
                                                        <span className="font-bold text-lg">{p.name}</span>
                                                    </td>
                                                    <td className="p-3 text-center text-green-400 font-bold">{p.correctCount}</td>
                                                    <td className="p-3 text-center text-red-400 font-bold">{p.wrongCount}</td>
                                                    <td className="p-3 text-right font-black text-2xl text-amber-400">{p.score}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                    <button onClick={() => { playSound('click'); setGameMode(null); setView('setup'); }} className="bg-indigo-500 hover:bg-indigo-400 text-white font-bold py-4 px-8 rounded-xl flex-1 text-center shadow-lg transition">
                                        🔄 MAIN LAGI
                                    </button>
                                    <button onClick={() => { playSound('click'); setView('materi'); }} className="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-4 px-8 rounded-xl flex-1 text-center shadow-lg transition">
                                        📚 PELAJARI MATERI
                                    </button>
                                    <button onClick={() => { playSound('click'); setView('home'); }} className="bg-white/20 hover:bg-white/30 text-white font-bold py-4 px-8 rounded-xl flex-1 text-center shadow-lg transition">
                                        🏠 HOME
                                    </button>
                                </div>

                            </div>
                        </div>
                    );
                }

                return null;
            };

            return (
                <React.Fragment>
                    <FloatingNav view={view} setView={setView} soundEnabled={soundEnabled} setSoundEnabled={setSoundEnabled} playSound={playSound} />
                    {renderView()}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
